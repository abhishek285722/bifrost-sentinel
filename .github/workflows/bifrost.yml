# .github/workflows/bifrost.yml
#
# Bifrost Sentinel — CI/CD Safety Pipeline
#
# Triggers on every pull request targeting `main`.
# Pipeline stages:
#   1. Checkout code
#   2. Set up Python 3.10
#   3. Run automated test suite
#   4. Run Bifrost Sentinel (full pipeline + report artefacts)
#   5. Upload SARIF to GitHub Code Scanning
#   6. Post PR comment with migration safety report

name: Bifrost Sentinel

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write   # required for upload-sarif
  pull-requests: write     # required for PR comment

jobs:
  bifrost:
    name: Migration Safety Check
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout ──────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Set up Python ─────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── Step 3: Run automated tests ───────────────────────────────────────
      - name: Run test suite
        run: python -m unittest discover -s tests -v

      # ── Step 4: Run Bifrost Sentinel ──────────────────────────────────────
      - name: Run Bifrost Sentinel (full pipeline + reports)
        run: python bifrost.py run --report
        # Exit 0 = rehearsal detected breakage AND healer restored compatibility.
        # The step fails if the pipeline itself fails unexpectedly.

      # ── Step 5: Upload SARIF to GitHub Code Scanning ─────────────────────
      - name: Upload SARIF to GitHub Code Scanning
        if: always()   # upload even when bifrost exits non-zero
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bifrost.sarif
          category: bifrost-sentinel

      # ── Step 6: Post PR comment ───────────────────────────────────────────
      - name: Post migration safety report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Read the generated Markdown comment
            let body;
            try {
              body = fs.readFileSync('pr_comment.md', 'utf8');
            } catch (e) {
              body = '⚠️ Bifrost: `pr_comment.md` was not generated. ' +
                     'Check the workflow logs for details.';
            }

            // Find and update an existing Bifrost comment, or create a new one
            const marker = '<!-- bifrost-sentinel -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body:       fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body:         fullBody,
              });
            }
